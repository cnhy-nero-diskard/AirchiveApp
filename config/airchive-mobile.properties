# Non-secret project/device configuration. Every value here is a PUBLIC
# identifier that ships inside the app build by design:
#   - Firebase client options (apiKey, applicationId, projectId,
#     googleWebClientId) identify the app/project to Firebase. Google treats the
#     client ApiKey and the Web OAuth client id as public; they are NOT secrets.
#   - device/read-contract values pin reads to the owner's one device.
# NEVER put secrets in this file: no service-account JSON/private key, no
# collector or LG ThinQ PAT, no owner token, no signing key. Blank firebase.*
# options keep the debug build green and make the owner-auth factory report a
# missing-options state until the operator registers the app and fills them in.
firebase.projectId=airchive-telemetry-poller

# Android client and Google sign-in configured on 2026-10-02. The registered
# Android certificate is this machine's debug certificate; a future release
# signing certificate must be registered separately. These are public client
# identifiers returned by Firebase, not owner credentials or access grants.
firebase.apiKey=AIzaSyBr_wBMaLmXdfdgrvTUAKwkN6otZpGXSvs
firebase.applicationId=1:397051202974:android:ae3a9a9b3c0c3951645a8f
firebase.googleWebClientId=397051202974-9om469lrbn8k0dkoh0kmt176k6osl1ql.apps.googleusercontent.com

device.id=d7dc30c9698797295acbb90ee543447738db8f7b3d5cff230eb66978a855be3a
day.timeZone=Asia/Manila

# Contract from sibling OpenSpec change add-owner-mobile-telemetry-access.
firestore.maxPageSize=250
firestore.getPaths=devices/{deviceId};devices/{deviceId}/runtime/collector
firestore.listPaths=devices/{deviceId}/telemetry/{sampleId};devices/{deviceId}/dailyTotals/{localDate}
firestore.clientWritesAllowed=false
firestore.requiresExactOwnerUid=true
firestore.ownerEnrollmentRequired=true

# Owner-confirmed actual temperature granularity for this configured AC.
# The LG REST profile advertises 0.5 C, but a manual 25.5 C request was read
# back as 25 C; expose only whole-degree targets in the app.
thinq.temperatureStepOverride=1.0
firestore.currentRulesStatus=deny-all
firestore.accessChange=add-owner-mobile-telemetry-access
