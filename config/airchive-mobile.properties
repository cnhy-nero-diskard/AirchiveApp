# Non-secret project/device configuration. Credentials and Firebase client API keys
# are intentionally excluded; owner enrollment remains an operator-controlled step.
firebase.projectId=airchive-telemetry-poller
device.id=d7dc30c9698797295acbb90ee543447738db8f7b3d5cff230eb66978a855be3a
day.timeZone=Asia/Manila

# Contract from sibling OpenSpec change add-owner-mobile-telemetry-access.
firestore.maxPageSize=250
firestore.getPaths=devices/{deviceId};devices/{deviceId}/runtime/collector
firestore.listPaths=devices/{deviceId}/telemetry/{sampleId};devices/{deviceId}/dailyTotals/{localDate}
firestore.clientWritesAllowed=false
firestore.requiresExactOwnerUid=true
firestore.ownerEnrollmentRequired=true
firestore.currentRulesStatus=deny-all
firestore.accessChange=add-owner-mobile-telemetry-access
