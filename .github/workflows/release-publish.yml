name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify and publish
        required: true
        type: string
      dry_run:
        description: Verify and upload the manifest as a workflow artifact without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'

      - name: Verify the draft and generate the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tag=$RELEASE_TAG
          if [[ ! "$tag" =~ ^v[0-9]+([.][0-9]+){2}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use the v<major>.<minor>.<patch> release format." >&2
            exit 1
          fi
          git fetch --quiet origin main --tags
          tag_commit=$(git rev-parse "$tag^{commit}")
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Tag $tag does not point to a commit contained in main." >&2
            exit 1
          }

          release_json=$(gh release view "$tag" --json isDraft,assets,body)
          is_draft=$(printf '%s' "$release_json" | jq -r '.isDraft')
          apk_asset_count=$(printf '%s' "$release_json" | jq '[.assets[] | select(.name | endswith(".apk"))] | length')
          if [ "$is_draft" != true ] || [ "$apk_asset_count" -ne 1 ]; then
            echo "Release $tag must be a draft with exactly one APK asset." >&2
            exit 1
          fi
          apk_dir="$RUNNER_TEMP/release-apk"
          mkdir -p "$apk_dir"
          gh release download "$tag" --pattern '*.apk' --dir "$apk_dir"
          apk_count=$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')
          if [ "$apk_count" -ne 1 ]; then
            echo "Expected one downloaded APK for $tag, found $apk_count." >&2
            exit 1
          fi
          apk_path=$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)

          version_properties=$(git show "$tag_commit:config/airchive-version.properties")
          version_name=$(printf '%s\n' "$version_properties" | sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*//p' | tail -1 | tr -d '\r' | sed 's/[[:space:]]*$//')
          version_code=$(printf '%s\n' "$version_properties" | sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*//p' | tail -1 | tr -d '\r' | sed 's/[[:space:]]*$//')
          if [ "$tag" != "v$version_name" ] || [[ ! "$version_code" =~ ^[0-9]+$ ]] || [ "$version_code" -le 2 ]; then
            echo "Tag, versionName, or first-release versionCode does not match the version file at $tag_commit." >&2
            exit 1
          fi
          scripts/release/check-apk.sh "$apk_path" "$version_name" "$version_code" "$tag_commit"

          published_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          release_index=0
          while IFS= read -r published_tag; do
            [ -n "$published_tag" ] || continue
            old_release_json=$(gh release view "$published_tag" --json assets)
            old_apk_count=$(printf '%s' "$old_release_json" | jq '[.assets[] | select(.name | endswith(".apk"))] | length')
            if [ "$old_apk_count" -ne 1 ]; then
              echo "Published release $published_tag does not contain exactly one APK; cannot compare version codes." >&2
              exit 1
            fi
            old_apk_dir="$RUNNER_TEMP/published-release-$release_index"
            mkdir -p "$old_apk_dir"
            gh release download "$published_tag" --pattern '*.apk' --dir "$old_apk_dir"
            old_apk=$(find "$old_apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)
            old_badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$old_apk")
            old_code=$(printf '%s\n' "$old_badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)
            if [[ ! "$old_code" =~ ^[0-9]+$ ]] || [ "$version_code" -le "$old_code" ]; then
              echo "VersionCode $version_code is not greater than published release $published_tag (code $old_code)." >&2
              exit 1
            fi
            release_index=$((release_index + 1))
          done <<EOF
          $published_tags
          EOF

          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$tag" --json body --jq .body > "$notes_file"
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          manifest="$RUNNER_TEMP/update.json"
          scripts/release/make-manifest.sh \
            --apk "$apk_path" \
            --tag "$tag" \
            --commit "$tag_commit" \
            --published-at "$published_at" \
            --release-body "$notes_file" \
            --output "$manifest"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run complete. The release remains a draft."
          fi

      - name: Upload dry-run manifest
        if: inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-manifest-${{ inputs.tag }}
          path: ${{ runner.temp }}/update.json
          if-no-files-found: error
          retention-days: 14

      - name: Attach the manifest and publish latest
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/update.json" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
