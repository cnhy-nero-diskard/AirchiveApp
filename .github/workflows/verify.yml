name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Temurin 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run host tests, debug assembly, and lint
        run: |
          ./gradlew --continue \
            :shared:testAndroidHostTest \
            :androidApp:assembleDebug \
            :androidApp:assembleDebugAndroidTest \
            :androidApp:lintDebug

      - name: Record the tested commit
        if: always()
        run: |
          printf 'Tested commit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: |
            shared/build/test-results/testAndroidHostTest/**
            shared/build/reports/tests/testAndroidHostTest/**
            androidApp/build/reports/lint-results-debug.html
            androidApp/build/reports/lint-results-debug.xml
            androidApp/build/reports/lint-results-debug.sarif
          if-no-files-found: error
          retention-days: 14
