name: instrumentation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instrumentation:
    name: instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Temurin 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK API 36 components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - name: Guard against live verification runner arguments
        run: |
          live_access='liveAccess''Check'
          live_history='liveHistory''Check'
          pattern="$live_access|$live_history"
          if grep -R -n -E "$pattern" .github/workflows; then
            echo 'A workflow contains an opt-in live verification runner argument.' >&2
            exit 1
          fi

      - name: Run Firebase-backed Android instrumentation batches
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          script: |
            firebase emulators:exec --config firebase.test.json --project demo-airchive-telemetry-poller \
              --only auth,firestore "bash scripts/ci/run_instrumentation_batches.sh"

      - name: Summarize instrumentation results
        if: always()
        run: python3 scripts/ci/instrumentation_summary.py androidApp/build/outputs/androidTest-results/connected

      - name: Upload JUnit XML and logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            androidApp/build/outputs/androidTest-results/connected/**/*.xml
            androidApp/build/outputs/instrumentation-logcat.txt
          if-no-files-found: warn
          retention-days: 14
