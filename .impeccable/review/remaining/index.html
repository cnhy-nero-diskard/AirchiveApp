<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Airchive · Shared Instrument</title>
<style>body{margin:0;background:#f1f4f5;color:#202d34;font:16px/1.5 system-ui,sans-serif;padding:32px}main{max-width:1440px;margin:auto}h1{font-size:32px;letter-spacing:-.02em;margin:0}p{color:#53666f}fieldset{display:flex;flex-wrap:wrap;gap:16px;border:0;padding:8px 0 24px}select{font:inherit;padding:8px;color:inherit;background:white;border:1px solid #71838e;border-radius:8px}section{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}figure{margin:0}figcaption{font-weight:600;margin-bottom:12px}img{display:block;width:100%;height:auto;border-radius:12px}a:focus-visible,select:focus-visible{outline:3px solid #315eaa;outline-offset:4px}@media(max-width:900px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){body{padding:20px}section{grid-template-columns:1fr}}</style>
<main><h1>Shared Instrument, across Airchive</h1><p>Actual Android emulator captures using isolated preview data. Select a theme and text size; open a screen to inspect the full capture.</p>
<p><a href="http://127.0.0.1:3317/">New: Simple and Detailed interface modes</a></p><fieldset><label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Text size <select id="scale"><option value="1.0">Standard</option><option value="1.3">Enlarged · 130%</option></select></label></fieldset><section id="screens"></section></main>
<script>const names=['device','energy','history','settings'];function show(){document.getElementById('screens').replaceChildren(...names.map(name=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),i=document.createElement('img');c.textContent=name[0].toUpperCase()+name.slice(1);i.src=name+'-'+document.getElementById('theme').value+'-'+document.getElementById('scale').value+'.png';i.alt=c.textContent+' native preview';i.width=1080;i.height=2400;a.href=i.src;a.append(i);f.append(c,a);return f}))}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',show));show();</script></html>
